<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Aluno | Minhas Sessões</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Aluno Estagiário</p>
				<h2>CRUD de Sessões e Evoluções</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-ghost" href="../indexAluno.html">Voltar ao Painel</a>
			</div>
		</header>

		<section class="card form-grid">
			<input type="hidden" id="sessao-id" />
			<label>Paciente
				<select id="sessao-paciente"></select>
			</label>
			<label>Prontuário
				<select id="sessao-prontuario"></select>
			</label>
			<label>Data da sessão
				<input id="sessao-data" type="date" />
			</label>
			<label>Status
				<select id="sessao-status">
					<option>Rascunho</option>
					<option>Enviado para revisão</option>
					<option>Aprovado</option>
				</select>
			</label>
			<label class="full">Evolução
				<textarea id="sessao-evolucao" rows="4" placeholder="Resumo da sessão"></textarea>
			</label>
			<div class="full actions-row">
				<button id="sessao-salvar" class="btn btn-primary" type="button">Salvar</button>
				<button id="sessao-limpar" class="btn btn-ghost" type="button">Limpar</button>
			</div>
		</section>

		<section class="card table-wrap">
			<table>
				<thead>
					<tr>
						<th>Data</th>
						<th>Paciente</th>
						<th>Status</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="sessoes-body"></tbody>
			</table>
			<div class="empty-state" id="sessoes-empty">Nenhuma sessão registrada.</div>
		</section>
	</main>
	<script src="index.js"></script>
</body>
</html>
