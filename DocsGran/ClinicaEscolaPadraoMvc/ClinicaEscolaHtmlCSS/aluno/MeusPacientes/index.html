<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Aluno | Meus Pacientes</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Aluno Estagiário</p>
				<h2>Meus Pacientes</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-ghost" href="../indexAluno.html">Voltar ao Painel</a>
			</div>
		</header>

		<section class="card table-wrap">
			<table>
				<thead>
					<tr>
						<th>Paciente</th>
						<th>Prontuário</th>
						<th>Situação</th>
						<th>Supervisora</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="meus-pacientes-body"></tbody>
			</table>
			<div class="empty-state" id="meus-pacientes-empty">Nenhum paciente vinculado ao seu usuário.</div>
		</section>
	</main>
	<script src="index.js"></script>
