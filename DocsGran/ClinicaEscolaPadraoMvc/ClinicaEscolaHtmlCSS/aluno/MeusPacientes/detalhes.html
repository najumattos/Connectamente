<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Aluno | Detalhes do Paciente</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Meus Pacientes</p>
				<h2>Detalhes do Paciente</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-ghost" href="./index.html">Voltar para Listagem</a>
			</div>
		</header>

		<section class="card info-block">
			<h3 class="section-title">Paciente</h3>
			<div class="details-grid">
				<p class="detail-item"><strong>Nome:</strong> <span id="d-nome">-</span></p>
				<p class="detail-item"><strong>CPF:</strong> <span id="d-cpf">-</span></p>
				<p class="detail-item"><strong>Nascimento:</strong> <span id="d-nascimento">-</span></p>
				<p class="detail-item"><strong>Telefone:</strong> <span id="d-telefone">-</span></p>
				<p class="detail-item full"><strong>Observações:</strong> <span id="d-observacoes">-</span></p>
			</div>
			<div class="details-grid" id="d-resumo-vinculos" style="margin-top: 10px;"></div>
			<div class="actions-row" style="margin-top: 12px;">
				<a class="btn btn-primary" href="../MinhasSessoes/index.html">Ir para Sessões</a>
				<a class="btn btn-ghost" href="../MeusDocumentos/index.html">Ir para Documentos</a>
			</div>
		</section>

		<section class="card table-wrap">
			<h3 class="section-title">Documentos do Paciente</h3>
			<table>
				<thead>
					<tr>
						<th>Tipo</th>
						<th>Status</th>
						<th>Data</th>
						<th>Navegação</th>
					</tr>
				</thead>
				<tbody id="docs-body"></tbody>
			</table>
			<div class="empty-state" id="docs-empty">Sem documentos para este paciente.</div>
		</section>
	</main>
	<script src="detalhes.js"></script>
</body>
</html>
