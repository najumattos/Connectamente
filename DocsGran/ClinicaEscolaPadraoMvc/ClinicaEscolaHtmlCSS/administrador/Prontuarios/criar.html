<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin | Criar Prontuário</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div><p class="eyebrow">Prontuários</p><h2>Criar Prontuário</h2></div>
			<div class="topbar-actions"><a class="btn btn-ghost" href="./index.html">Voltar</a></div>
		</header>
		<section class="card form-grid">
			<label>Número do prontuário<input id="numero" type="text" placeholder="PR-2026-0001" /></label>
			<label>Paciente<select id="paciente"></select></label>
			<label>Situação<select id="situacao"><option>Aberto</option><option>Em atendimento</option><option>Encerrado</option></select></label>
			<label>Data de abertura<input id="data" type="date" /></label>
			<label>Aluno responsável<input id="aluno" type="text" /></label>
			<label>Professora supervisora<input id="professora" type="text" /></label>
			<label class="full">Observações<textarea id="obs" rows="4"></textarea></label>
			<div class="full actions-row"><button id="salvar" class="btn btn-primary" type="button">Salvar</button><a class="btn btn-ghost" href="./index.html">Cancelar</a></div>
		</section>
	</main>
	<script src="criar.js"></script>
</body>
</html>
