<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin | Editar Paciente</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Pacientes</p>
				<h2>Editar Paciente</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-ghost" href="./index.html">Voltar para Listagem</a>
			</div>
		</header>

		<section class="card form-grid">
			<label>Nome completo
				<input id="paciente-nome" type="text" />
			</label>
			<label>CPF
				<input id="paciente-cpf" type="text" />
			</label>
			<label>Data de nascimento
				<input id="paciente-nascimento" type="date" />
			</label>
			<label>Telefone
				<input id="paciente-telefone" type="text" />
			</label>
			<label class="full">Observações
				<textarea id="paciente-observacoes" rows="4"></textarea>
			</label>
			<div class="full actions-row">
				<button id="paciente-salvar" class="btn btn-primary" type="button">Salvar Alterações</button>
				<a class="btn btn-ghost" href="./index.html">Cancelar</a>
			</div>
		</section>
	</main>
	<script src="editar.js"></script>
</body>
</html>
