<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin | Vínculos</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Administrativo</p>
				<h2>Lista de Vínculos</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-ghost" href="../indexAdmin.html">Voltar ao Painel</a>
			</div>
		</header>

		<section class="card table-wrap">
			<div class="toolbar">
				<input id="vinculo-busca" type="text" placeholder="Buscar por paciente, aluno ou status" />
				<p class="inline-note">Visualização consolidada dos vínculos aluno-paciente.</p>
			</div>
			<table>
				<thead>
					<tr>
						<th>Paciente</th>
						<th>Aluno</th>
						<th>Permissões</th>
						<th>Data Liberação</th>
						<th>Liberado Por</th>
						<th>Status</th>
					</tr>
				</thead>
				<tbody id="vinculos-body"></tbody>
			</table>
			<div class="empty-state" id="vinculos-empty">Nenhum vínculo encontrado.</div>
		</section>
	</main>
	<script src="index.js"></script>
</body>
</html>
