<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Clínica-Escola | Login</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>

	<main class="app-shell">
		<section class="screen is-active" id="screen-login" data-screen="login">
			<div class="login-layout">
				<div class="card login-card">
					<h2>Login</h2>
					<p class="muted">
						Modo demonstração: entrada sem validação obrigatória.
					</p>

					<label for="login-email">E-mail institucional</label>
					<input id="login-email" type="email" placeholder="email@faculdade.edu" />

					<label for="login-password">Senha</label>
					<input id="login-password" type="password" placeholder="••••••••" />

					<div class="login-actions">
						<button id="btn-enter" class="btn btn-primary" type="button">Entrar</button>
						<button id="btn-fill" class="btn btn-ghost" type="button">Preencher exemplo</button>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script src="index.js"></script>
</body>
</html>
