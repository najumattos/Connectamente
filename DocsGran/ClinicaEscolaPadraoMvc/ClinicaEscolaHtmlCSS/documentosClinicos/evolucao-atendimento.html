<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>EvolucaoAtendimento</title>
	<link rel="stylesheet" href="../index.css" />
	<link rel="stylesheet" href="./documentosClinicos.css" />
</head>
<body>
	<main class="doc-shell">
		<header class="doc-header">
			<div>
				<p class="eyebrow">TipoDocumentoClinico</p>
				<h2>EvolucaoAtendimento</h2>
			</div>
			<a class="btn btn-ghost" href="./index.html">Voltar</a>
		</header>
		<form class="card doc-form">
			<label>Data da sessao
				<input type="date" />
			</label>
			<label>Numero da sessao
				<input type="text" placeholder="Sessao 1, 2, 3..." />
			</label>
			<label>Status clinico
				<input type="text" placeholder="Evolucao percebida" />
			</label>
			<label>Plano da proxima sessao
				<input type="text" placeholder="Objetivo seguinte" />
			</label>
			<label class="full">Registro evolutivo
				<textarea rows="5"></textarea>
			</label>
		</form>
	</main>
</body>
</html>
