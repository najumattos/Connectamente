<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AnamneseAdulto</title>
	<link rel="stylesheet" href="../index.css" />
	<link rel="stylesheet" href="./documentosClinicos.css" />
</head>
<body>
	<main class="doc-shell">
		<header class="doc-header">
			<div>
				<p class="eyebrow">TipoDocumentoClinico</p>
				<h2>AnamneseAdulto</h2>
			</div>
			<a class="btn btn-ghost" href="./index.html">Voltar</a>
		</header>
		<form class="card doc-form">
			<label>Queixa principal
				<input type="text" placeholder="Resumo da demanda" />
			</label>
			<label>Inicio da queixa
				<input type="date" />
			</label>
			<label>Historico familiar
				<input type="text" placeholder="Aspectos relevantes" />
			</label>
			<label>Uso de medicacao
				<input type="text" placeholder="Medicacoes atuais" />
			</label>
			<label class="full">Anamnese detalhada
				<textarea rows="5"></textarea>
			</label>
		</form>
	</main>
</body>
</html>
