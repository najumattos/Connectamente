<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AnamneseAdolescente</title>
	<link rel="stylesheet" href="../index.css" />
	<link rel="stylesheet" href="./documentosClinicos.css" />
</head>
<body>
	<main class="doc-shell">
		<header class="doc-header">
			<div>
				<p class="eyebrow">TipoDocumentoClinico</p>
				<h2>AnamneseAdolescente</h2>
			</div>
			<a class="btn btn-ghost" href="./index.html">Voltar</a>
		</header>
		<form class="card doc-form">
			<label>Escola/serie
				<input type="text" placeholder="Instituicao e serie" />
			</label>
			<label>Responsavel presente
				<input type="text" placeholder="Nome do responsavel" />
			</label>
			<label>Convivio familiar
				<input type="text" placeholder="Resumo do contexto" />
			</label>
			<label>Rede de apoio
				<input type="text" placeholder="Familia, escola, servicos" />
			</label>
			<label class="full">Anamnese detalhada
				<textarea rows="5"></textarea>
			</label>
		</form>
	</main>
</body>
</html>
