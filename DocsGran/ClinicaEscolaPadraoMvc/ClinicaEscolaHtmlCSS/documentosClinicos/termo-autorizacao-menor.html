<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TermoAutorizacaoMenor</title>
	<link rel="stylesheet" href="../index.css" />
	<link rel="stylesheet" href="./documentosClinicos.css" />
</head>
<body>
	<main class="doc-shell">
		<header class="doc-header">
			<div>
				<p class="eyebrow">TipoDocumentoClinico</p>
				<h2>TermoAutorizacaoMenor</h2>
			</div>
			<a class="btn btn-ghost" href="./index.html">Voltar</a>
		</header>
		<form class="card doc-form">
			<label>Nome do menor
				<input type="text" />
			</label>
			<label>Nome do responsavel
				<input type="text" />
			</label>
			<label>Grau de parentesco
				<input type="text" />
			</label>
			<label>Documento do responsavel
				<input type="text" placeholder="CPF/RG" />
			</label>
			<label class="full">Texto de autorizacao
				<textarea rows="5"></textarea>
			</label>
		</form>
	</main>
</body>
</html>
