<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TermoPsicoterapiaIndividual</title>
	<link rel="stylesheet" href="../index.css" />
	<link rel="stylesheet" href="./documentosClinicos.css" />
</head>
<body>
	<main class="doc-shell">
		<header class="doc-header">
			<div>
				<p class="eyebrow">TipoDocumentoClinico</p>
				<h2>TermoPsicoterapiaIndividual</h2>
			</div>
			<a class="btn btn-ghost" href="./index.html">Voltar</a>
		</header>
		<form class="card doc-form">
			<label>Frequencia
				<input type="text" placeholder="Semanal/quinzenal" />
			</label>
			<label>Duracao prevista
				<input type="text" placeholder="Em meses" />
			</label>
			<label>Regra de faltas
				<input type="text" placeholder="Ex: 3 faltas consecutivas" />
			</label>
			<label>Data de assinatura
				<input type="date" />
			</label>
			<label class="full">Clausulas acordadas
				<textarea rows="5"></textarea>
			</label>
		</form>
	</main>
</body>
</html>
