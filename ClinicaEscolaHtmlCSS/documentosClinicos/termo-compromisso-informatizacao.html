<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TermoCompromissoInformatizacao</title>
	<link rel="stylesheet" href="../index.css" />
	<link rel="stylesheet" href="./documentosClinicos.css" />
</head>
<body>
	<main class="doc-shell">
		<header class="doc-header">
			<div>
				<p class="eyebrow">TipoDocumentoClinico</p>
				<h2>TermoCompromissoInformatizacao</h2>
			</div>
			<a class="btn btn-ghost" href="./index.html">Voltar</a>
		</header>
		<form class="card doc-form">
			<label>Paciente/Responsavel
				<input type="text" />
			</label>
			<label>Data de ciencia
				<input type="date" />
			</label>
			<label>Nivel de consentimento
				<input type="text" placeholder="Total/parcial" />
			</label>
			<label>Canal de assinatura
				<input type="text" placeholder="Fisica/digital" />
			</label>
			<label class="full">Termo e observacoes de sigilo
				<textarea rows="5"></textarea>
			</label>
		</form>
	</main>
</body>
</html>
