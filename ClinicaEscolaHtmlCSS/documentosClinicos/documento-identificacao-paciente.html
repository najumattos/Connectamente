<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DocumentoIdentificacaoPaciente</title>
	<link rel="stylesheet" href="../index.css" />
	<link rel="stylesheet" href="./documentosClinicos.css" />
</head>
<body>
	<main class="doc-shell">
		<header class="doc-header">
			<div>
				<p class="eyebrow">TipoDocumentoClinico</p>
				<h2>DocumentoIdentificacaoPaciente</h2>
			</div>
			<a class="btn btn-ghost" href="./index.html">Voltar</a>
		</header>
		<form class="card doc-form">
			<label>Nome completo
				<input type="text" placeholder="Nome do paciente" />
			</label>
			<label>CPF
				<input type="text" placeholder="000.000.000-00" />
			</label>
			<label>Data de nascimento
				<input type="date" />
			</label>
			<label>Telefone
				<input type="text" placeholder="(00) 00000-0000" />
			</label>
			<label>Endereco
				<input type="text" placeholder="Rua, numero, bairro" />
			</label>
			<label>Responsavel legal
				<input type="text" placeholder="Nome do responsavel" />
			</label>
			<label class="full">Observacoes cadastrais
				<textarea rows="4"></textarea>
			</label>
		</form>
	</main>
</body>
</html>
