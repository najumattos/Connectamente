<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Aluno | Detalhes do Documento</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div><p class="eyebrow">Meus Documentos</p><h2>Detalhes do Documento</h2></div>
			<div class="topbar-actions"><a class="btn btn-ghost" href="./index.html">Voltar para Meus Documentos</a></div>
		</header>

		<section class="card info-block">
			<div id="doc-grid" class="details-grid"></div>
			<div class="actions-row" style="margin-top: 12px;">
				<a id="go-paciente" class="btn btn-primary" href="../MeusPacientes/index.html">Paciente</a>
				<a id="go-modelo" class="btn btn-ghost" href="../../documentosClinicos/index.html">Modelo do Tipo</a>
			</div>
		</section>

		<section class="card patient-doc-nav">
			<h4>Documentos do mesmo paciente</h4>
			<p class="muted">Navegação curta entre documentos sem voltar para listagem.</p>
			<div class="actions-row">
				<a id="prev-doc" class="btn btn-ghost" href="./index.html">Anterior</a>
				<a id="next-doc" class="btn btn-ghost" href="./index.html">Próximo</a>
			</div>
			<label>Ir para documento específico
				<select id="doc-picker"></select>
			</label>
		</section>
	</main>
	<script src="detalhes.js"></script>
</body>
</html>
