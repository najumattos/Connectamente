<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Aluno | Meus Documentos</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Aluno Estagiário</p>
				<h2>Meus Documentos</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-primary" href="./criar.html">Novo Documento</a>
				<a class="btn btn-ghost" href="../indexAluno.html">Voltar ao Painel</a>
			</div>
		</header>

		<section class="card table-wrap">
			<table>
				<thead>
					<tr>
						<th>Tipo</th>
						<th>Paciente</th>
						<th>Status</th>
						<th>Data</th>
						<th>Ações CRUD</th>
					</tr>
				</thead>
				<tbody id="documentos-body"></tbody>
			</table>
			<div class="empty-state" id="documentos-empty">Nenhum documento criado por você.</div>
		</section>
	</main>
	<script src="index.js"></script>
</body>
</html>
