<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin | CRUD Prontuários</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Administrativo</p>
				<h2>Prontuários</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-primary" href="./criar.html">Novo Prontuário</a>
				<a class="btn btn-ghost" href="../indexAdmin.html">Voltar ao Painel</a>
			</div>
		</header>

		<section class="card table-wrap">
			<table>
				<thead>
					<tr>
						<th>Número</th>
						<th>Paciente</th>
						<th>Situação</th>
						<th>Aluno</th>
						<th>Status</th>
						<th>Ações CRUD</th>
					</tr>
				</thead>
				<tbody id="prontuarios-body"></tbody>
			</table>
			<div class="empty-state" id="prontuarios-empty">Nenhum prontuário cadastrado.</div>
		</section>
	</main>
	<script src="index.js"></script>
</body>
</html>
