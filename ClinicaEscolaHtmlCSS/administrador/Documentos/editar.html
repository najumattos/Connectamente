<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin | Editar Documento</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar"><div><p class="eyebrow">Documentos</p><h2>Editar Documento Clínico</h2></div><div class="topbar-actions"><a class="btn btn-ghost" href="./index.html">Voltar</a></div></header>
		<section class="card form-grid">
			<label>Tipo<select id="tipo"><option>AnamneseAdulto</option><option>AnamneseAdolescente</option><option>PlantaoPsicologico</option><option>EvolucaoAtendimento</option><option>TermoPsicoterapiaIndividual</option><option>TermoAutorizacaoMenor</option><option>TermoCompromissoInformatizacao</option><option>TermoResponsabilidadeEstagiario</option></select></label>
			<label>Paciente<select id="paciente"></select></label>
			<label>Prontuário<select id="prontuario"></select></label>
			<label>Status<select id="status"><option>Rascunho</option><option>Em revisão</option><option>Finalizado</option></select></label>
			<label>Autor<input id="autor" type="text" /></label>
			<label>Supervisor<input id="supervisor" type="text" /></label>
			<label>Versão<input id="versao" type="text" /></label>
			<label>Data<input id="data" type="date" /></label>
			<label class="full">Resumo<textarea id="resumo" rows="4"></textarea></label>
			<div class="full actions-row"><button id="salvar" class="btn btn-primary" type="button">Salvar Alterações</button><a class="btn btn-ghost" href="./index.html">Cancelar</a></div>
		</section>
	</main>
	<script src="editar.js"></script>
</body>
</html>
