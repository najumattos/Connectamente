<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin | Ativar ou Inativar Paciente</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Pacientes</p>
				<h2>Ativar/Inativar Paciente</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-ghost" href="./index.html">Voltar para Listagem</a>
			</div>
		</header>

		<section class="card info-block">
			<h4 id="paciente-nome">Paciente</h4>
			<p id="paciente-status" class="muted">Status atual: -</p>
			<div class="actions-row" style="margin-top: 12px;">
				<button id="btn-toggle" class="btn btn-primary" type="button">Alterar Status</button>
				<a class="btn btn-ghost" href="./index.html">Cancelar</a>
			</div>
		</section>
	</main>
	<script src="status.js"></script>
</body>
</html>
