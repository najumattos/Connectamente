<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin | Detalhes do Paciente</title>
	<link rel="stylesheet" href="../../index.css" />
</head>
<body>
	<div class="bg-shape shape-a"></div>
	<div class="bg-shape shape-b"></div>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Administrativo</p>
				<h2>Detalhes do Paciente</h2>
			</div>
			<div class="topbar-actions">
				<a class="btn btn-ghost" href="./index.html">Voltar para Pacientes</a>
			</div>
		</header>

		<section class="card info-block">
			<h3 class="section-title">PacienteFormViewModel</h3>
			<div class="details-grid" id="paciente-grid"></div>
		</section>

		<section class="card info-block">
			<h3 class="section-title">Prontuário do Paciente</h3>
			<div id="prontuario-resumo" class="details-grid"></div>
			<div class="actions-row" style="margin-top: 12px;">
				<a id="go-prontuario" class="btn btn-primary" href="../Prontuarios/index.html">Abrir Prontuário</a>
				<a id="go-documentos" class="btn btn-ghost" href="../Documentos/index.html">Abrir Documentos</a>
			</div>
		</section>

		<section class="card table-wrap">
			<h3 class="section-title">Documentos do Paciente</h3>
			<table>
				<thead>
					<tr>
						<th>Tipo</th>
						<th>Status</th>
						<th>Autor</th>
						<th>Data</th>
						<th>Navegação</th>
					</tr>
				</thead>
				<tbody id="docs-body"></tbody>
			</table>
			<div class="empty-state" id="docs-empty">Sem documentos para este paciente.</div>
		</section>
	</main>
	<script src="detalhes.js"></script>
</body>
</html>
